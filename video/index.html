<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>PI-SPI expliqué</title>
<style>
:root{
  --bg:#FFF6EA; --ink:#14213D; --muted:#5B6476; --orange:#F77F00; --orange2:#FFB45C;
  --green:#009E60; --green2:#7FD3AE; --blue:#2563EB; --sky:#DCEBFF; --red:#E63946;
  --yellow:#FFC233; --card:#FFFFFF; --line:#E8DCCB; --violet:#7C3AED; --teal:#0E9AA7;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:Inter,"Noto Color Emoji",sans-serif;color:var(--ink)}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
#bgdeco{position:absolute;inset:0;pointer-events:none}
.scene{position:absolute;inset:0;opacity:0}
.abs{position:absolute}
.center{display:flex;align-items:center;justify-content:center}
.col{display:flex;flex-direction:column}
.row{display:flex;align-items:center}

/* chrome */
#brand{position:absolute;left:56px;top:34px;display:flex;align-items:center;gap:14px;font-weight:800;font-size:28px;z-index:5}
#brand .dot{width:44px;height:44px;border-radius:12px;background:var(--orange);display:flex;align-items:center;justify-content:center;color:#fff}
#brand small{font-weight:600;color:var(--muted);font-size:22px}
#chapter{position:absolute;right:56px;top:38px;font-size:24px;font-weight:700;color:var(--muted);z-index:5;display:flex;gap:12px;align-items:center}
#chapter b{background:var(--ink);color:#fff;border-radius:999px;padding:6px 16px;font-size:22px}
#progress{position:absolute;left:0;top:0;height:8px;background:var(--orange);z-index:6}
#subs{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);max-width:1560px;z-index:7;
  background:rgba(20,33,61,.92);color:#fff;font-size:40px;line-height:1.3;font-weight:600;
  padding:18px 34px;border-radius:22px;text-align:center}
#subs:empty{display:none}

/* generic pieces */
.card{background:var(--card);border-radius:28px;box-shadow:0 10px 30px rgba(20,33,61,.08),0 2px 6px rgba(20,33,61,.06)}
.h1{font-size:76px;font-weight:900;letter-spacing:-1.5px;line-height:1.05}
.h2{font-size:54px;font-weight:850;letter-spacing:-1px;line-height:1.1}
.h3{font-size:38px;font-weight:800;line-height:1.15}
.p{font-size:30px;font-weight:600;color:var(--muted);line-height:1.3}
.pill{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:10px 22px;font-weight:800;font-size:28px}
.chip{display:inline-flex;align-items:center;border-radius:14px;padding:10px 18px;font-weight:800;font-size:26px;background:#fff;border:3px solid var(--line)}
.ic{display:inline-block;vertical-align:middle}
.orange{color:var(--orange)} .green{color:var(--green)} .red{color:var(--red)} .blue{color:var(--blue)} .muted{color:var(--muted)}

/* phone */
.phone{position:absolute;width:300px;height:600px;border-radius:44px;background:#1B2333;padding:14px;box-shadow:0 20px 40px rgba(20,33,61,.25)}
.phone .scr{position:relative;width:100%;height:100%;border-radius:32px;background:#F7F8FB;overflow:hidden}
.phone .bar{height:86px;display:flex;align-items:flex-end;padding:0 22px 14px;color:#fff;font-weight:800;font-size:24px}
.phone .notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:90px;height:22px;border-radius:12px;background:#1B2333;z-index:3}
.phone .view{position:absolute;left:0;right:0;top:86px;bottom:0;padding:22px 20px}
.btn{border-radius:16px;padding:16px;font-weight:800;font-size:22px;text-align:center;color:#fff}
.field{background:#fff;border:2px solid #DDE2EA;border-radius:14px;padding:12px 14px;font-size:22px;font-weight:700;min-height:52px}
.field label{display:block;font-size:15px;color:var(--muted);font-weight:700;margin-bottom:4px}

/* island */
.island{position:absolute;width:250px;height:170px;border-radius:50%;background:#F4D9A6;box-shadow:inset 0 -14px 0 #E2BF7F;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;font-weight:800;font-size:25px}
svg{overflow:visible}
</style>
</head>
<body>
<div id="stage">
  <svg id="bgdeco" width="1920" height="1080">
    <circle cx="1820" cy="1010" r="240" fill="#FFE7C7"/>
    <circle cx="90" cy="1040" r="160" fill="#DFF3E9"/>
  </svg>
  <div id="progress"></div>
  <div id="brand"><div class="dot" id="brandIcon"></div><span>PI-SPI <small>expliqué simplement</small></span></div>
  <div id="chapter"></div>
  <div id="scenes"></div>
  <div id="subs"></div>
</div>
<script src="build/timings.js"></script>
<script src="scenes.js"></script>
<script src="engine.js"></script>
</body>
</html>
